<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Розподіл витрат за видами робіт та послуг на третій рік експерименту</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FCAE10;
    --green:#ABBA3D;
    --blue:#3798D8;
    --ink:#141414;
    --gray:#6b7078;
    --line:#e7eaee;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .card{
    width:100%;
    max-width:820px;
    margin:0 auto;
    padding:clamp(18px,4.2vw,36px) clamp(16px,4.5vw,40px) clamp(16px,3vw,26px);
    background:var(--bg);
  }
  .card h1{
    font-size:clamp(16.5px,4.2vw,23px);
    font-weight:800;
    line-height:1.25;
    margin:0 0 clamp(12px,3vw,18px);
    letter-spacing:-0.01em;
  }

  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    background:#f2f3f5;
    padding:4px;
    border-radius:11px;
    width:100%;
    margin-bottom:clamp(14px,3.5vw,20px);
  }
  .tab{
    appearance:none;
    border:none;
    background:transparent;
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    font-size:clamp(11px,2.6vw,13.5px);
    color:var(--gray);
    padding:8px 14px;
    border-radius:8px;
    transition:background .15s ease, color .15s ease;
    white-space:nowrap;
    flex:1 1 auto;
    text-align:center;
  }
  .tab.active{
    background:#ffffff;
    color:var(--ink);
    box-shadow:0 1px 3px rgba(0,0,0,.12);
  }

  .card .subtitle{
    font-size:clamp(11px,2.6vw,13px);
    color:var(--gray);
    margin:0 0 clamp(18px,4.5vw,26px);
    font-weight:500;
  }

  .content{
    display:flex;
    align-items:center;
    gap:clamp(20px,5vw,44px);
    flex-wrap:wrap;
  }

  .donut-box{
    position:relative;
    width:clamp(160px,38vw,220px);
    height:clamp(160px,38vw,220px);
    flex-shrink:0;
    margin:0 auto;
  }
  .donut-box svg{
    width:100%;
    height:100%;
    display:block;
  }
  .donut-box circle{
    transition:stroke-dasharray .5s ease, stroke-dashoffset .5s ease;
  }
  .donut-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    pointer-events:none;
  }
  .donut-center .num{
    font-size:clamp(16px,4.1vw,23px);
    font-weight:800;
    color:var(--ink);
    line-height:1.15;
    max-width:60%;
    word-break:break-word;
  }
  .donut-center .num.long{
    font-size:clamp(13px,3.4vw,17px);
  }
  .donut-center .cap{
    font-size:clamp(9px,2.1vw,10.5px);
    font-weight:600;
    color:var(--gray);
    margin-top:4px;
    max-width:56%;
    line-height:1.35;
  }

  .legend-list{
    flex:1;
    min-width:220px;
    display:flex;
    flex-direction:column;
    gap:clamp(12px,3vw,16px);
  }
  .legend-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .swatch{
    width:13px;height:13px;border-radius:4px;
    flex-shrink:0;
    margin-top:3px;
  }
  .legend-text .name{
    font-size:clamp(12px,2.8vw,14px);
    font-weight:700;
    color:var(--ink);
    line-height:1.3;
  }
  .legend-text .metric{
    font-size:clamp(12.5px,3vw,15.5px);
    font-weight:800;
    color:var(--ink);
    margin-top:3px;
  }
  .legend-text .metric .pct{
    color:var(--gray);
    font-weight:600;
    font-size:0.85em;
    margin-left:5px;
  }

  .footer{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    margin-top:clamp(22px,5.5vw,34px);
    padding-top:clamp(12px,3vw,18px);
    border-top:1px solid var(--line);
  }
  .logos{
    display:flex;
    align-items:center;
    gap:clamp(14px,3.5vw,22px);
  }
  .logos img{display:block;}
  .logo-norway{height:clamp(16px,3.6vw,26px);width:auto;}
  .logo-ti{height:clamp(21px,4.6vw,34px);width:auto;}
</style>
</head>

<script>
const categories = [
  {key:"construction", name:"Будівельні роботи", color:"orange"},
  {key:"pkd", name:"ПКД", color:"green"},
  {key:"supervision", name:"Технічний / авторський нагляд", color:"blue"},
];

const places = [
  {name:"Бородянка", construction:1570521168.04, pkd:44790725.42, supervision:6385807.60},
  {name:"Посад-Покровське", construction:108893592.94, pkd:0.00, supervision:9859012.06},
  {name:"Тростянець", construction:25521657.28, pkd:440412.00, supervision:64080.00},
  {name:"Ягідне", construction:246865415.26, pkd:495269.27, supervision:2790471.75},
  {name:"Загалом", construction:1951801833.52, pkd:45726406.69, supervision:19099371.41},
];
places.forEach(p => { p.total = p.construction + p.pkd + p.supervision; });

function fmtGrn(v){
  if (v === 0) return '0 грн';
  const mln = v / 1e6;
  if (mln >= 1000){
    return (mln/1000).toFixed(2).replace('.', ',') + ' млрд грн';
  }
  if (mln >= 10){
    return Math.round(mln).toLocaleString('uk-UA') + ' млн грн';
  }
  if (mln >= 1){
    return mln.toFixed(1).replace('.', ',') + ' млн грн';
  }
  return Math.round(v / 1000).toLocaleString('uk-UA') + ' тис. грн';
}
function fmtPct(part, base){
  if (!base) return '0,0%';
  return (part / base * 100).toFixed(1).replace('.', ',') + '%';
}

const C = 2 * Math.PI * 80;
const arcsG = document.getElementById('arcs');
const centerNum = document.getElementById('centerNum');
const subtitle = document.getElementById('subtitle');
const legendList = document.getElementById('legendList');
const tabsEl = document.getElementById('tabs');

tabsEl.innerHTML = places.map((p, i) =>
  `<button class="tab${i===0?' active':''}" data-idx="${i}">${p.name}</button>`
).join('');

function render(idx){
  const p = places[idx];
  subtitle.textContent = `Розподіл фактичних витрат за видами робіт та послуг — ${p.name}`;

  let cumulative = 0;
  arcsG.innerHTML = categories.map(cat => {
    const pct = p[cat.key] / p.total * 100;
    const len = (pct/100) * C;
    const offset = -cumulative;
    cumulative += len;
    return `<circle cx="100" cy="100" r="80" fill="none" stroke="var(--${cat.color})" stroke-width="30" stroke-linecap="butt" transform="rotate(-90 100 100)" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${offset}"/>`;
  }).join('');

  const totalStr = fmtGrn(p.total);
  centerNum.textContent = totalStr;
  centerNum.classList.toggle('long', totalStr.length > 12);

  legendList.innerHTML = categories.map(cat => {
    const v = p[cat.key];
    return `
      <div class="legend-row">
        <span class="swatch" style="background:var(--${cat.color})"></span>
        <div class="legend-text">
          <div class="name">${cat.name}</div>
          <div class="metric">${fmtGrn(v)} <span class="pct">(${fmtPct(v, p.total)})</span></div>
        </div>
      </div>
    `;
  }).join('');
}

tabsEl.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    render(Number(tab.dataset.idx));
  });
});

render(0);
</script>
